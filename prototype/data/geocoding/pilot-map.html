<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City geocoding pilot</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:16px system-ui;margin:24px;color:#19344b}#map{height:65vh;min-height:380px}li{margin:10px 0}a{color:#075aa4}</style><h1>Fullerton and Anaheim geocoding pilot</h1><p>5 approximate candidates for review. Blue: Fullerton. Orange: Anaheim.</p><p>Approximate location within the reported block. Address-range matches do not verify individual buildings or incident locations.</p><div id="map"></div><ul id="locations"></ul><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const points=[{"city": "Fullerton", "address": "3500 BLOCK W COMMONWEALTH AVE", "selected": "3500 W COMMONWEALTH AVE", "lat": 33.869961640078, "lon": -117.973677708242}, {"city": "Fullerton", "address": "2700 BLOCK W ORANGETHORPE AVE", "selected": "2700 W ORANGETHORPE AVE", "lat": 33.859061700207, "lon": -117.974512999275}, {"city": "Fullerton", "address": "1500 BLOCK DEERPARK DR", "selected": "1500 DEERPARK DR", "lat": 33.885761077199, "lon": -117.878814976696}, {"city": "Anaheim", "address": "100 BLOCK S RIO VISTA ST", "selected": "100 S RIO VISTA ST", "lat": 33.8414156948, "lon": -117.87158599975}, {"city": "Anaheim", "address": "3100 BLOCK W LINCOLN AVE", "selected": "3100 W LINCOLN AVE", "lat": 33.83187526639, "lon": -117.997949407096}];const map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);const bounds=[];for(const p of points){const box=document.createElement('div');const label=document.createElement('strong');label.textContent=p.city+': '+p.address;box.append(label,document.createElement('br'));const text=document.createElement('span');text.textContent='Approximate location; awaiting review.';box.append(text,document.createElement('br'));const a=document.createElement('a');a.href='https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lon+'#map=18/'+p.lat+'/'+p.lon;a.target='_blank';a.rel='noopener';a.textContent='Inspect this location';box.append(a);L.circleMarker([p.lat,p.lon],{radius:9,color:p.city==='Fullerton'?'#1266ae':'#ba5300',fillOpacity:.8}).addTo(map).bindPopup(box);bounds.push([p.lat,p.lon]);const li=document.createElement('li');li.append(box.cloneNode(true));document.getElementById('locations').append(li)}if(bounds.length){map.fitBounds(bounds,{padding:[35,35]})}else{map.setView([33.85,-117.93],12)};</script></html>
